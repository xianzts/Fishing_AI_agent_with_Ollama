<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>垂钓 Agent 测试页面</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 600px; max-width: 100%; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); overflow: hidden; }
        .hidden { display: none !important; }
        .panel { padding: 30px; }
        h2 { margin-bottom: 20px; color: #2c3e50; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: 500; }
        input[type="text"], input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; transition: border 0.3s; }
        input[type="text"]:focus, input[type="password"]:focus { outline: none; border-color: #3498db; }
        button { background: #3498db; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 14px; transition: background 0.3s; }
        button:hover { background: #2980b9; }
        button:disabled { background: #95a5a6; cursor: not-allowed; }
        .error { color: #e74c3c; margin-top: 10px; font-size: 14px; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .chat-header button { background: #e74c3c; padding: 6px 12px; }
        .chat-messages { height: 350px; overflow-y: auto; border: 1px solid #ddd; border-radius: 6px; padding: 15px; background: #fafafa; margin-bottom: 15px; }
        .message { margin-bottom: 12px; display: flex; flex-direction: column; }
        .message.user { align-items: flex-end; }
        .message.assistant { align-items: flex-start; }
        .bubble { max-width: 70%; padding: 10px 14px; border-radius: 18px; font-size: 14px; line-height: 1.5; word-wrap: break-word; }
        .user .bubble { background: #3498db; color: #fff; border-bottom-right-radius: 4px; }
        .assistant .bubble { background: #ecf0f1; color: #2c3e50; border-bottom-left-radius: 4px; }
        .input-area { display: flex; gap: 10px; }
        .input-area input[type="text"] { flex: 1; }
        .status { margin-top: 10px; text-align: center; color: #7f8c8d; font-size: 13px; }
        /* 聊天输入区（保持原样） */
        .input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 10px; /* 和上传区留出一点间距 */
        }

        /* 上传区容器：让内部元素靠右对齐 */
        .upload-area {
            display: flex;
            justify-content: flex-end; /* 核心：靠右对齐 */
            align-items: center;
            gap: 10px;
        }

        /* 自定义“选择文件”按钮 */
        .file-label {
            background: #ecf0f1;
            color: #333;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            border: 1px solid #ccc;
            transition: background 0.3s;
        }
        .file-label:hover {
            background: #dcdde1;
        }

        /* 显示选择的文件名 */
        .file-name {
            font-size: 13px;
            color: #7f8c8d;
            max-width: 150px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 上传按钮样式（可统一复用你原有的 button 样式） */
        .upload-btn {
            background: #3498db;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        .upload-btn:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录面板 -->
        <div id="login-panel" class="panel">
            <h2>垂钓 Agent 登录</h2>
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" placeholder="请输入用户名">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <button id="login-btn" onclick="login()">登录</button>
            <div id="login-error" class="error"></div>
        </div>

        <!-- 聊天面板 -->
        <div id="chat-panel" class="panel hidden">
            <div class="chat-header">
                <h2>垂钓问答</h2>
                <button onclick="logout()">退出登录</button>
            </div>
            <div id="chat-messages" class="chat-messages"></div>
            <div class="input-area">
                <input type="text" id="question" placeholder="请输入垂钓问题..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button id="send-btn" onclick="sendMessage()">发送</button>
            </div>
            <div id="status" class="status"></div>

            <!-- 上传区 -->
            <div class="upload-area">
                <!-- 隐藏原生的文件选择框，用 label 自定义样式 -->
                <input type="file" id="knowledge-files" multiple accept=".pdf,.docx,.txt" style="display: none;">
                <label for="knowledge-files" class="file-label">选择文件</label>
                <span id="file-name" class="file-name">未选择文件</span>
                <button class="upload-btn" onclick="uploadKnowledge()">上传私有知识</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== 配置 ====================
        const BASE_URL = 'http://127.0.0.1:8000';  // 请根据实际后端地址修改
        const LOGIN_PATH = '/login';
        const CHAT_PATH = '/rag/chat';

        // ==================== 工具函数 ====================
        function getToken() {
            return localStorage.getItem('access_token');
        }

        function setToken(token) {
            localStorage.setItem('access_token', token);
        }

        function clearToken() {
            localStorage.removeItem('access_token');
        }

        function showLoginPanel() {
            document.getElementById('login-panel').classList.remove('hidden');
            document.getElementById('chat-panel').classList.add('hidden');
            clearToken();
        }

        function showChatPanel() {
            document.getElementById('login-panel').classList.add('hidden');
            document.getElementById('chat-panel').classList.remove('hidden');
        }

        function displayError(msg) {
            document.getElementById('login-error').textContent = msg;
        }

        function setStatus(msg) {
            document.getElementById('status').textContent = msg;
        }

        function addMessage(role, content) {
            const messagesDiv = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.textContent = content;
            messageDiv.appendChild(bubble);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function isTokenExpired(token) {
            try {
                // JWT 格式：header.payload.signature，payload 是 Base64Url 编码的 JSON
                const payload = JSON.parse(atob(token.split('.')[1]));
                if (!payload.exp) return true;          // 没有 exp 字段视为过期
                const expTime = payload.exp * 1000;     // exp 单位是秒，转换为毫秒
                return Date.now() >= expTime;           // 当前时间大于等于过期时间则已过期
            } catch (e) {
                return true;   // 解析失败也视为无效 token
            }
        }

        // ==================== 登录 ====================
        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            if (!username || !password) {
                displayError('请输入用户名和密码');
                return;
            }

            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.textContent = '登录中...';
            displayError('');

            try {
                // 使用表单格式发送，匹配 OAuth2PasswordRequestForm
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch(`${BASE_URL}${LOGIN_PATH}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData.toString()
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.detail || `登录失败 (${response.status})`);
                }

                const data = await response.json();
                const token = data.access_token;
                if (!token) {
                    throw new Error('响应中未包含 access_token');
                }
                setToken(token);
                showChatPanel();
                localStorage.setItem('username', username);
                addMessage('assistant', '登录成功！我是垂钓助手，请问有什么可以帮你？');
            } catch (err) {
                displayError(err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '登录';
            }
        }

        // ==================== 退出登录 ====================
        function logout() {
            clearToken();
            localStorage.removeItem('username');
            showLoginPanel();
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            displayError('');
            document.getElementById('chat-messages').innerHTML = '';
        }

        // ==================== 发送消息（流式） ====================
        async function sendMessage() {
            const input = document.getElementById('question');
            const question = input.value.trim();
            if (!question) return;

            const token = getToken();
            if (!token) {
                alert('请先登录');
                showLoginPanel();
                return;
            }

            addMessage('user', question);
            input.value = '';
            setStatus('正在思考...');
            document.getElementById('send-btn').disabled = true;

            // 创建临时助手消息气泡
            const messagesDiv = document.getElementById('chat-messages');
            const assistantMsgDiv = document.createElement('div');
            assistantMsgDiv.className = 'message assistant';
            const assistantBubble = document.createElement('div');
            assistantBubble.className = 'bubble';
            assistantBubble.textContent = '';
            assistantMsgDiv.appendChild(assistantBubble);
            messagesDiv.appendChild(assistantMsgDiv);

            try {
                // 将问题作为查询参数传递
                const url = new URL(`${BASE_URL}${CHAT_PATH}`);
                url.searchParams.append('question', question);

                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                // 处理滑动过期（如果后端实现了 X-New-Token 响应头）
                const newToken = response.headers.get('X-New-Token');
                if (newToken) {
                    setToken(newToken);
                    console.log('Token 已更新');
                }

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.detail || `请求失败 (${response.status})`);
                }

                // 读取 SSE 流
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let doneFlag = false;

                while (!doneFlag) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    // 按空行分割 SSE 事件
                    const events = buffer.split('\n\n');
                    buffer = events.pop(); // 保留最后可能不完整的事件

                    for (const event of events) {
                        if (!event.trim()) continue;
                        // 查找 data: 行
                        const dataLine = event.split('\n').find(line => line.startsWith('data:'));
                        if (dataLine) {
                            const dataStr = dataLine.slice(5).trim();
                            if (dataStr) {
                                try {
                                    const data = JSON.parse(dataStr);
                                    if (data.chunk && data.chunk !== '[DONE]') {
                                        assistantBubble.textContent += data.chunk;
                                        messagesDiv.scrollTop = messagesDiv.scrollHeight;
                                    } else if (data.chunk === '[DONE]') {
                                        doneFlag = true;
                                        break;
                                    } else if (data.error) {
                                        assistantBubble.textContent = '错误：' + data.error;
                                        doneFlag = true;
                                        break;
                                    }
                                } catch (e) {
                                    // 忽略非 JSON 数据
                                }
                            }
                        }
                    }
                    if (doneFlag) break;
                }

                if (!doneFlag) {
                    // 流意外结束
                    assistantBubble.textContent += '\n[流结束]';
                }
                setStatus('');
            } catch (err) {
                assistantBubble.textContent = '错误：' + err.message;
                setStatus('');
            } finally {
                document.getElementById('send-btn').disabled = false;
            }
        }
        async function uploadKnowledge() {
            const input = document.getElementById('knowledge-files');
            if (!input.files.length) return alert('请选择文件');

            const formData = new FormData();
            for (const file of input.files) {
                formData.append('files', file);
            }

            const token = getToken();
            try {
                const response = await fetch(`${BASE_URL}/knowledge/upload`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                const data = await response.json();
                alert(data.message || '上传完成');
            } catch (err) {
                alert('上传失败：' + err.message);
            } finally {
                // 清空已选文件，无论成功与否
                input.value = '';
                document.getElementById('file-name').textContent = '未选择文件'; // 手动重置
            }
        }

        // ==================== 初始化 ====================
        document.getElementById('knowledge-files').addEventListener('change', function() {
            const fileNameSpan = document.getElementById('file-name');

            if (this.files.length === 0) {
                fileNameSpan.textContent = '未选择文件';
            } else if (this.files.length === 1) {
                // 如果只选了一个文件，显示文件名
                fileNameSpan.textContent = this.files[0].name;
            } else {
                // 如果选了多个文件，显示文件数量
                fileNameSpan.textContent = `已选择 ${this.files.length} 个文件`;
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const token = getToken();
            if (token && !isTokenExpired(token)) {
                const savedUsername = localStorage.getItem('username') || '';
                showChatPanel();
                addMessage('assistant', `欢迎回来，${savedUsername}！`);
            } else {
                clearToken();
                localStorage.removeItem('username');
                showLoginPanel();
            }
        });
    </script>
</body>
</html>
